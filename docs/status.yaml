# Vortex — port status, as structured data.
#
# WHAT THIS IS: the current state of the port, in records a script can check. Every number here
# is DERIVED from the trees on disk, so `node tools/check-status.mjs` re-measures and fails when a
# row has drifted. That is the whole point of the format: a markdown table cannot rot loudly, this
# can.
#
# WHAT THIS IS NOT: a changelog. What was fixed, when and why lives in git, attached to the diff
# that proves it. Nor is it a coverage report — `scripts/as3-member-coverage.mjs` and its siblings
# print those, and they are local tooling (see CLAUDE.md), so their output is not copied here where
# it would go stale unnoticed.
#
# THE ONE CAVEAT THAT APPLIES TO EVERY NUMBER BELOW: a TS count at or above the AS3 count means
# the files exist. It does not mean the members are ported, that anything reaches them, or that the
# behaviour matches. Never quote a global percentage from this file — there isn't an honest one.

meta:
  measured: 2026-09-07
  method: >-
    Recursive .as under sources/WIN63-202607011411-782849652/src/com/sulake/<module>/ against
    recursive .ts under packages/vortex-engine/src/<module>/.
  primary_as3: sources/WIN63-202607011411-782849652

