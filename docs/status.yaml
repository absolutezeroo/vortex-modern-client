# The AS3 trees. These are inputs, not progress: they only change when a new dump lands.
sources:
  - path: sources/WIN63-202607011411-782849652/src/com/sulake
    as3: 3345
    role: primary
  - path: sources/WIN63-202607011411-782849652/src/unknowns
    as3: 1839
    role: primary
    note: >-
      Counted as client code: 556 files under src/com/sulake/ import from it (parser DTOs,
      composers). Not a bundled stranger.
  - path: sources/win63_version
    as3: 4783
    role: secondary
    note: Names only — a worse decompile. Never read a body from it. See CLAUDE.md.
  - path: sources/PRODUCTION-201601012205-226667486/src/com/sulake
    as3: 4029
    role: tertiary
    note: 2016 build. Use to identify a class or recover a member name, never as behaviour.

