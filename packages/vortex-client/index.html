<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Vortex</title>
</head>
<body>

<div id="vortex-ui"></div>

<script type="module">
    const existingConfig = window.VortexConfig ?? {};
    const existingConnection = existingConfig.connection ?? {};

    // `?sso=<ticket>` is how the CMS hands the client a session it already authenticated
    // (packages/vortex-web, pages/HotelPage.svelte), and it is the same mechanism the real hotel
    // uses: habbo.com puts the ticket in the client's FlashVars rather than making the visitor sign
    // in twice. With no ticket the client runs its own login flow, exactly as before — see
    // App.ts::init(), which branches on connection.ssoTicket.
    const ssoTicket = new URLSearchParams(window.location.search).get('sso');

    window.VortexConfig = {
        ...existingConfig,
        connection: {
            // Served from this machine, dial it directly. Served from anywhere else — a phone on the
            // LAN, a Cloudflare tunnel — dial the socket back through the SAME origin the page came
            // from, which vortex-web proxies at /ws. A hardcoded 127.0.0.1 is the visitor's own
            // loopback, and a tunnel has no second port to hand out anyway.
            //
            // SocketConnection accepts a full ws://|wss:// URL as `host` and ignores `ports` then.
            host: ['localhost', '127.0.0.1'].includes(window.location.hostname)
                ? '127.0.0.1'
                : `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws`,
            ports: [40001],
            ...existingConnection,
            // Last, so the ticket for THIS visit wins over anything a host page hardcoded.
            ...(ssoTicket ? {ssoTicket} : {}),
        }
    };
</script>

<script src="./src/index.ts" type="module"></script>
</body>
</html>
